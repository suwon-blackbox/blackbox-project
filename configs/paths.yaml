# PC마다 다른 경로는 여기서만 바꾼다. 코드는 이 파일을 읽는다.
# 각자 PC에서 configs/paths.local.yaml 을 만들면 그 값이 우선한다 (git 제외).

# AI Hub 교통사고 영상 데이터 루트 ("01.데이터" 폴더)
aihub_root: "AI_HUB_data/095.교통사고 영상 데이터/01.데이터"

# 인벤토리 CSV 출력 위치
inventory_dir: "data/inventory"

# 우리 학습/평가 분할과 라벨링 대상 목록 (scripts/make_splits.py 출력)
splits_dir: "data/splits"

# 선별한 블랙박스 영상을 풀어 둘 곳 (학습 PC로 복사하는 단위)
raw_dir: "data/raw"

# 공통 전처리 캐시 (프레임·트랙·광류). 팀원끼리 공유하는 파일
cache_dir: "data/cache"
